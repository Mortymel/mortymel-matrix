name: Compilar y publicar instalador ESP32-S3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PlatformIO y esptool
        run: python -m pip install --disable-pip-version-check platformio esptool==4.8.1 Markdown==3.7
      - name: Generar y comprobar interfaz
        run: |
          python scripts/embed_web.py
          git diff --exit-code -- include/web_ui.h
      - name: Verificar selección automática
        run: node --test tests/profile.test.mjs
      - name: Compilar firmware
        run: pio run -e s3-4mb -e esp32-s3 -e s3-16mb -e esp32-classic -e esp32-s2
      - name: Preparar imagen USB y sitio
        run: |
          python scripts/package_flasher.py
          python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-s3
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-s3
          path: dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
