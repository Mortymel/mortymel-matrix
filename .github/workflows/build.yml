name: Compilar ESP32-S3

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Generar y comprobar interfaz
        run: |
          python scripts/embed_web.py
          git diff --exit-code -- include/web_ui.h
      - name: Compilar firmware
        run: pio run -e esp32-s3
