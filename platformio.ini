[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
  adafruit/Adafruit GFX Library
  bitbank2/AnimatedGIF
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DMATRIX_E_PIN=-1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; GPIO E can also be configured later in the local web console. Other HUB75
; signals retain the library defaults; verify the complete mapping first.
