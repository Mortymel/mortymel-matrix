[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display
  bitbank2/AnimatedGIF
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DMATRIX_E_PIN=-1

; Replace MATRIX_E_PIN with the E signal GPIO of your board profile to enable a
; 1/32-scan 64x64 panel. No universal pin mapping exists for all ESP32-S3 boards.
