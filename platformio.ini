[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions/matrix_8mb.csv
lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#cf09801a362c71fc61da99751972b6dfb6e63b63
  adafruit/Adafruit GFX Library
  bitbank2/AnimatedGIF
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DMATRIX_E_PIN=-1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; The web console can remap all 14 HUB75 signals. E=-1 keeps output disabled.
; These presets target ESP32-S3 with quad-line flash (QD). OPI needs its own build.

[env:s3-4mb]
extends = env:esp32-s3
board_upload.flash_size = 4MB
board_build.partitions = partitions/matrix_4mb.csv

[env:s3-16mb]
extends = env:esp32-s3
board_upload.flash_size = 16MB
board_build.partitions = partitions/matrix_16mb.csv

; Classic ESP32 and S2 use the same 4 MB minimum layout. Flash capacity
; and chip family are selected in the browser, never by the end user.
[env:esp32-classic]
extends = env:esp32-s3
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = partitions/matrix_4mb.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DMATRIX_E_PIN=-1

[env:esp32-s2]
extends = env:esp32-s3
board = esp32-s2-saola-1
board_upload.flash_size = 4MB
board_build.partitions = partitions/matrix_4mb.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DMATRIX_E_PIN=-1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
