<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f3ec"><title>Morty's · Acceso</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#f4f3ec;--surface:#fffef9;--text:#20231e;--muted:#717667;--line:#d9dcd0;--accent:#dcf681}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151c16;--surface:#1e281f;--text:#eef4e6;--muted:#aab8a0;--line:#3c4a38;--accent:#c4e888}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{padding:26px max(24px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--line)}.brand{font-weight:850;font-size:27px;letter-spacing:-1.2px;display:flex;align-items:center;gap:10px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#20231e}.brand small{font-size:10px;letter-spacing:2px;margin-left:12px;color:var(--muted)}main{flex:1;display:grid;place-items:center;padding:40px 18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(26px,5vw,46px);width:min(100%,440px);box-shadow:0 16px 48px #0000000c}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted)}h1{font-size:38px;letter-spacing:-1.8px;line-height:1.08;margin:12px 0}p{color:var(--muted);line-height:1.6;font-size:14px;margin:0 0 28px}label{display:block;font-weight:650;font-size:13px;margin:18px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);padding:13px 14px;font:inherit;outline:none}input:focus{border-color:#72953c;box-shadow:0 0 0 3px #a4c65c30}.password{display:flex;gap:8px}.password input{min-width:0}.password button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:0 12px;cursor:pointer}button.submit{width:100%;margin-top:26px;background:var(--accent);color:#20231e;border:0;border-radius:11px;padding:15px;font-weight:800;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;color:#c43d39;margin-top:13px;font-size:13px}footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
</style></head><body><header><div class="brand"><span class="mark">m</span>Morty´s <small>PIXEL LAB</small></div></header><main><section class="card"><div class="eyebrow">CONTROL LOCAL · ESP32</div><h1>Bienvenido de nuevo.</h1><p>Inicia sesión para controlar tu matriz LED, imágenes y ajustes.</p><form id="login"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" value="admin" required maxlength="32"><label for="password">Contraseña</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="toggle" type="button" aria-label="Mostrar contraseña">Mostrar</button></div><button class="submit" id="submit" type="submit">Entrar al panel →</button><div class="error" id="error" role="alert" aria-live="polite"></div></form></section></main><footer>Morty´s · Control local y privado</footer><script>
const pass=document.getElementById('password');document.getElementById('toggle').onclick=()=>{const visible=pass.type==='password';pass.type=visible?'text':'password';document.getElementById('toggle').textContent=visible?'Ocultar':'Mostrar'};
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:pass.value})});const data=await r.json();if(!r.ok)throw Error(data.error||'No se pudo iniciar sesión');location.replace('/')}catch(e){error.textContent=e.message;button.disabled=false}};
</script></body></html>
